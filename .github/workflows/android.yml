name: Android - APK natif (preview)
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tests import GGUF
        run: |
          mkdir -p "$RUNNER_TEMP/model-tests"
          javac -d "$RUNNER_TEMP/model-tests" android/app/src/main/java/fr/ialocale/mobile/ModelFiles.java android/tests/ModelFilesTest.java
          java -cp "$RUNNER_TEMP/model-tests" fr.ialocale.mobile.ModelFilesTest
      - name: Installer les outils Android
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools'
      - name: SDK NDK CMake
        shell: bash
        run: |
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
      - name: Compilation native et APK debug
        working-directory: android
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug
      - name: Vérifier APK et signature
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/IA-Locale-Studio.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/IA-Locale-Studio.apk
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/IA-Locale-Studio.apk') as z:
              assert z.testzip() is None
              for f in ('AndroidManifest.xml','classes.dex','lib/arm64-v8a/libialocale.so','lib/x86_64/libialocale.so'):
                  assert f in z.namelist(), f
          PY
          cd dist
          sha256sum IA-Locale-Studio.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: IA-Locale-Studio-Android-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
