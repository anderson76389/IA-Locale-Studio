plugins { id 'com.android.application' }
android {
    namespace 'fr.ialocale.mobile'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'fr.ialocale.mobile'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('IA_VERSION_CODE') ?: '1')
        versionName '0.1-native-preview'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
