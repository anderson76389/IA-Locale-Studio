pluginManagement {
    repositories {
        google()
        // Maven Central mirror documented by Google Cloud, avoids shared runner rate limits.
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
    }
}
rootProject.name = 'IA Locale Android Natif'
include ':app'
